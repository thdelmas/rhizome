<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhizome — KB graph</title>
<style>
  /* committed dark tool page; palette = validated dark categorical steps */
  :root {
    --surface-1: #1a1a19;
    --surface-2: #242423;
    --line: #33332f;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8a897f;
    --other: #6b6a63;
    --accent: #3987e5;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--surface-1);
    color: var(--text-primary);
    font: 14px/1.45 system-ui, sans-serif;
    overflow: hidden; height: 100vh; display: flex;
  }

  /* ---- left: graph + bottom dock ---- */
  #left { flex: 1 1 58%; position: relative; min-width: 0; }
  #graph { position: absolute; inset: 0; }
  #dock {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    background: color-mix(in srgb, var(--surface-2) 92%, transparent);
    border-top: 1px solid var(--line);
    padding: 8px 12px;
    display: flex; flex-direction: column; gap: 6px;
  }
  #dockrow1 { display: flex; align-items: center; gap: 10px; position: relative; }
  #search {
    width: 230px; padding: 6px 9px;
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid #3d3d38; border-radius: 6px; font-size: 13px;
  }
  #search:focus { outline: 1px solid var(--accent); }
  #results {
    position: absolute; bottom: 100%; left: 0; margin-bottom: 6px; width: 300px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
    max-height: 45vh; overflow-y: auto; z-index: 3;
  }
  #results:empty { display: none; }
  #results button {
    display: block; width: 100%; padding: 5px 9px; border: 0; text-align: left;
    background: transparent; color: var(--text-secondary); font-size: 12.5px;
    cursor: pointer;
  }
  #results button:hover { background: var(--surface-1); }
  #results .t { color: var(--text-muted); }
  #ego { display: none; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 12.5px; }
  #ego.on { display: flex; }
  #ego input[type=range] { width: 90px; accent-color: var(--accent); }
  #ego button {
    padding: 4px 9px; border-radius: 6px; border: 1px solid #3d3d38;
    background: var(--surface-1); color: var(--text-primary); font-size: 12px; cursor: pointer;
  }
  #stats { margin-left: auto; color: var(--text-muted); font-size: 12px; white-space: nowrap; }
  #types { display: flex; flex-wrap: wrap; gap: 2px 4px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 8px; border: 0; border-radius: 6px;
    background: transparent; color: var(--text-secondary);
    font-size: 12.5px; cursor: pointer;
  }
  .chip:hover { background: var(--surface-1); }
  .chip.off { opacity: 0.32; }
  .chip .glyph { font-size: 10px; line-height: 1; flex: none; }
  .chip .n { color: var(--text-muted); font-size: 11.5px; }
  .chip.orphan { border: 1px solid var(--line); }
  .chip.orphan.on { border-color: var(--accent); color: var(--text-primary); }
  #results .snip { display: block; color: var(--text-muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- right: reader ---- */
  #reader {
    flex: 1 1 42%; min-width: 320px; max-width: 560px;
    background: var(--surface-2);
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  #reader header {
    display: flex; align-items: baseline; gap: 10px;
    padding: 12px 16px 8px; border-bottom: 1px solid var(--line); flex: none;
  }
  #reader header .title { font-size: 15px; font-weight: 600; word-break: break-word; }
  #reader header .obs {
    margin-left: auto; flex: none; font-size: 12px; color: var(--accent);
    text-decoration: none; border: 1px solid #3d3d38; border-radius: 6px; padding: 3px 8px;
  }
  #reader .path { padding: 6px 16px 0; color: var(--text-muted); font-size: 11.5px; word-break: break-all; flex: none; }
  #reader article { padding: 10px 16px 24px; overflow-y: auto; font-size: 13.5px; color: var(--text-secondary); }
  #reader article .empty { color: var(--text-muted); margin-top: 20px; text-align: center; }
  #reader article h1, #reader article h2, #reader article h3, #reader article h4 {
    color: var(--text-primary); margin: 14px 0 6px; line-height: 1.3;
  }
  #reader article h1 { font-size: 17px; } #reader article h2 { font-size: 15px; }
  #reader article h3, #reader article h4 { font-size: 13.5px; }
  #reader article p { margin: 7px 0; }
  #reader article ul, #reader article ol { margin: 7px 0 7px 20px; }
  #reader article blockquote { margin: 7px 0; padding: 2px 10px; border-left: 3px solid #4a4a44; color: var(--text-muted); }
  #reader article pre {
    background: var(--surface-1); border-radius: 6px; padding: 9px 11px;
    overflow-x: auto; margin: 8px 0; font-size: 12px;
  }
  #reader article code { background: var(--surface-1); border-radius: 4px; padding: 1px 4px; font-size: 12.5px; }
  #reader article pre code { background: none; padding: 0; }
  #reader article a { color: var(--accent); text-decoration: none; }
  #reader article a:hover { text-decoration: underline; }
  #reader article a.wiki { cursor: pointer; }
  #reader article a.dead { color: var(--text-muted); cursor: default; }
  #reader article table { border-collapse: collapse; margin: 8px 0; display: block; overflow-x: auto; }
  #reader article td, #reader article th { border: 1px solid var(--line); padding: 3px 8px; font-size: 12.5px; }
  #reader article .fm {
    background: var(--surface-1); border-radius: 6px; padding: 8px 11px;
    margin-bottom: 10px; font-size: 11.5px; color: var(--text-muted);
    white-space: pre-wrap; font-family: monospace;
  }
  #reader article hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  #reader article .backlinks { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 8px; }
  #reader article .backlinks h4 { color: var(--text-muted); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  #reader article .backlinks ul { margin-left: 16px; }
  #reader article .backlinks .t { color: var(--text-muted); font-size: 11.5px; }
</style>
</head>
<body>
<div id="left">
  <div id="graph"></div>
  <div id="dock">
    <div id="dockrow1">
      <div id="results"></div>
      <input id="search" type="search" placeholder="Search notes…" autocomplete="off">
      <div id="ego">
        <b class="name"></b>
        <span>depth</span><input type="range" min="1" max="4" value="1"><b class="d">1</b>
        <button class="exit">Exit sub-graph</button>
      </div>
      <div id="stats"></div>
    </div>
    <div id="types"></div>
  </div>
</div>
<div id="reader">
  <header>
    <span class="title">Rhizome</span>
    <a class="obs" href="#" hidden>Open in Obsidian</a>
  </header>
  <div class="path"></div>
  <article><p class="empty">Click a node to read it here.</p></article>
</div>
<script src="vendor/3d-force-graph.min.js"></script>
<script>
// Validated dark-mode categorical steps, fixed order. Types rank by size:
// rank i gets color i%8 + shape i/8, so 24 types stay distinguishable; rest fold to Other.
const HUES = ["#3987e5","#d95926","#199e70","#c98500","#d55181","#008300","#9085e9","#e66767"];
const GLYPHS = ["●","■","◆","▲","⬢","⬟","✚","▰"];  // sphere, cube, octa, tetra, hex prism, pyramid, cross, tri prism
const MAX_TYPES = 24;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const OTHER = css("--other");

let DATA, typeStyle = new Map(), typeOn = new Map(), adj = new Map(), byStem = new Map();
let byId = new Map(), inbound = new Map(), kindColor = new Map();
let focusId = null, depth = 1, orphansOnly = false;

const leftEl = document.getElementById("left");
const Graph = ForceGraph3D()(document.getElementById("graph"))
  .backgroundColor(css("--surface-1"))
  .nodeLabel(n => `${esc(n.name)}<br><span style="color:#8a897f">${esc(n.type)} · ${adj.get(n.id)?.size ?? 0} links</span>`)
  .nodeColor(n => typeStyle.get(n.type)?.color ?? OTHER)
  .nodeVal(n => 1 + Math.min(10, (adj.get(n.id)?.size ?? 0)))
  .linkColor(l => kindColor.get(l.kind) ?? "#55544d")
  .linkOpacity(0.45)
  .linkLabel(l => l.kind ? esc(l.kind) : "")
  .onNodeClick(n => select(n.id))
  .onBackgroundClick(() => focusId && exitEgo());

function fit() { Graph.width(leftEl.clientWidth).height(leftEl.clientHeight); }
new ResizeObserver(fit).observe(leftEl);

function esc(s){ const d = document.createElement("i"); d.textContent = s; return d.innerHTML; }

/* ---------- node shapes ----------
   The vendored bundle keeps THREE internal, so constructors are extracted from a
   probe node's default mesh (Mesh via clone(), BufferGeometry via the prototype
   chain). If the probe never materializes we fall back to default spheres. */
let T = null;
const geomCache = new Map(), matCache = new Map();

function face(arr, ...v) { // convex planar polygon, origin inside the solid: orient outward, fan-triangulate
  const [a, b, c] = v;
  const u = [b[0]-a[0], b[1]-a[1], b[2]-a[2]], w = [c[0]-a[0], c[1]-a[1], c[2]-a[2]];
  const n = [u[1]*w[2]-u[2]*w[1], u[2]*w[0]-u[0]*w[2], u[0]*w[1]-u[1]*w[0]];
  const ctr = [0, 1, 2].map(k => v.reduce((s, p) => s + p[k], 0) / v.length);
  if (n[0]*ctr[0] + n[1]*ctr[1] + n[2]*ctr[2] < 0) v.reverse();
  for (let i = 1; i + 1 < v.length; i++) arr.push(...v[0], ...v[i], ...v[i + 1]);
}
function box(arr, hx, hy, hz, ox = 0, oy = 0, oz = 0) {
  const c = (sx, sy, sz) => [sx*hx+ox, sy*hy+oy, sz*hz+oz];
  face(arr, c(1,-1,-1), c(1,1,-1), c(1,1,1), c(1,-1,1));
  face(arr, c(-1,-1,-1), c(-1,1,-1), c(-1,1,1), c(-1,-1,1));
  face(arr, c(-1,1,-1), c(1,1,-1), c(1,1,1), c(-1,1,1));
  face(arr, c(-1,-1,-1), c(1,-1,-1), c(1,-1,1), c(-1,-1,1));
  face(arr, c(-1,-1,1), c(1,-1,1), c(1,1,1), c(-1,1,1));
  face(arr, c(-1,-1,-1), c(1,-1,-1), c(1,1,-1), c(-1,1,-1));
}
function prism(arr, sides, r, hy) { // n-gonal prism: two caps + side quads
  const ring = y => Array.from({length: sides}, (_, i) => {
    const a = (i / sides) * 2 * Math.PI + Math.PI / sides;
    return [r * Math.cos(a), y, r * Math.sin(a)];
  });
  const top = ring(hy), bot = ring(-hy);
  face(arr, ...top); face(arr, ...bot);
  for (let i = 0; i < sides; i++) {
    const j = (i + 1) % sides;
    face(arr, top[i], top[j], bot[j], bot[i]);
  }
}
const SHAPE_BUILDERS = [
  null, // sphere — uses the real SphereGeometry
  arr => box(arr, 0.72, 0.72, 0.72),
  arr => { const V = s => s * 1.05; // octahedron
    for (const sx of [1,-1]) for (const sy of [1,-1]) for (const sz of [1,-1])
      face(arr, [V(sx),0,0], [0,V(sy),0], [0,0,V(sz)]); },
  arr => { const s = 0.8, v = [[s,s,s],[s,-s,-s],[-s,s,-s],[-s,-s,s]]; // tetrahedron
    face(arr, v[0], v[1], v[2]); face(arr, v[0], v[3], v[1]);
    face(arr, v[0], v[2], v[3]); face(arr, v[1], v[3], v[2]); },
  arr => prism(arr, 6, 0.85, 0.55),
  arr => { const s = 0.95, y = -0.55, apex = [0, 0.95, 0]; // square pyramid
    const b = [[-s,y,-s],[s,y,-s],[s,y,s],[-s,y,s]];
    face(arr, ...b);
    for (let i = 0; i < 4; i++) face(arr, b[i], b[(i+1)%4], apex); },
  arr => { box(arr, 1.05, 0.32, 0.32); box(arr, 0.32, 1.05, 0.32); box(arr, 0.32, 0.32, 1.05); }, // cross
  arr => prism(arr, 3, 1.0, 0.5),
];
function geomFor(shape) {
  if (!geomCache.has(shape)) {
    if (!shape) geomCache.set(shape, new T.SphereGeometry(1, 12, 8));
    else {
      const arr = [];
      SHAPE_BUILDERS[shape](arr);
      const g = new T.BufferGeometry();
      g.setAttribute("position", new T.Attr(new Float32Array(arr), 3));
      g.computeVertexNormals();
      geomCache.set(shape, g);
    }
  }
  return geomCache.get(shape);
}
function matFor(color) {
  if (!matCache.has(color)) {
    const m = T.template.material.clone();
    m.color.set(color);
    matCache.set(color, m);
  }
  return matCache.get(color);
}
function meshFor(n) {
  if (!T) return false; // default sphere
  const st = typeStyle.get(n.type);
  const m = T.template.clone();
  m.geometry = geomFor(st?.shape ?? 0);
  m.material = matFor(st?.color ?? OTHER);
  m.scale.setScalar(Math.cbrt(1 + Math.min(10, adj.get(n.id)?.size ?? 0)) * 4);
  return m;
}

Graph.graphData({ nodes: [{ id: "__probe__", name: "", type: "" }], links: [] });
(function grabTHREE(tries) {
  const probe = Graph.graphData().nodes[0];
  if (probe?.__threeObj?.geometry) {
    const mesh = probe.__threeObj;
    T = {
      template: mesh.clone(),
      SphereGeometry: mesh.geometry.constructor,
      BufferGeometry: Object.getPrototypeOf(mesh.geometry.constructor),
      Attr: mesh.geometry.attributes.position.constructor,
    };
    T.template.scale.setScalar(1);
    Graph.nodeThreeObject(meshFor);
    start();
  } else if (tries < 90) requestAnimationFrame(() => grabTHREE(tries + 1));
  else start(); // shapes unavailable — color-only spheres
})(0);

function start() {
fetch("graph.json").then(r => r.json()).then(data => {
  DATA = data;
  for (const n of data.nodes) {
    const stem = n.id.split("/").pop().replace(/\.md$/, "");
    byStem.set(stem, n.id);
    if (!byStem.has(n.name)) byStem.set(n.name, n.id);
    byId.set(n.id, n);
  }
  for (const [a, id] of Object.entries(data.aliases ?? {})) {
    if (!byStem.has(a)) byStem.set(a, id);
  }
  for (const l of data.links) {
    if (!adj.has(l.source)) adj.set(l.source, new Set());
    if (!adj.has(l.target)) adj.set(l.target, new Set());
    adj.get(l.source).add(l.target);
    adj.get(l.target).add(l.source);
    if (!inbound.has(l.target)) inbound.set(l.target, new Set());
    inbound.get(l.target).add(l.source);
  }
  // top edge kinds by count share the hue order; the rest stay neutral
  const kindCounts = new Map();
  for (const l of data.links) if (l.kind) kindCounts.set(l.kind, (kindCounts.get(l.kind) ?? 0) + 1);
  [...kindCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, HUES.length)
    .forEach(([k], i) => kindColor.set(k, HUES[i]));
  // top types by node count take color i%8 + shape i/8; the rest fold to Other
  const counts = new Map();
  for (const n of data.nodes) counts.set(n.type, (counts.get(n.type) ?? 0) + 1);
  const ranked = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  ranked.forEach(([t], i) => {
    if (i < MAX_TYPES) {
      const shape = Math.floor(i / HUES.length);
      typeStyle.set(t, { color: HUES[i % HUES.length], shape, glyph: GLYPHS[shape] });
    }
    typeOn.set(t, true);
  });
  renderChips(ranked);
  fit();
  redraw();
  const deep = new URLSearchParams(location.search).get("open");
  if (deep && DATA.nodes.some(n => n.id === deep)) select(deep);
});
}

function renderChips(ranked) {
  const box = document.getElementById("types");
  const top = ranked.slice(0, MAX_TYPES);
  const restN = ranked.slice(MAX_TYPES).reduce((s, [, n]) => s + n, 0);
  box.innerHTML = "";
  for (const [t, n] of top) {
    const st = typeStyle.get(t);
    box.appendChild(chip(t, st.color, st.glyph, t, n));
  }
  if (restN) box.appendChild(chip("__other__", OTHER, "●", `Other (${ranked.length - top.length} types)`, restN));
  const orphanN = DATA.nodes.filter(n => !(adj.get(n.id)?.size)).length;
  if (orphanN) {
    const b = document.createElement("button");
    b.className = "chip orphan";
    b.title = "Show only unlinked notes";
    b.innerHTML = `<span class="glyph">◌</span><span>Orphans</span><span class="n">${orphanN}</span>`;
    b.onclick = () => { orphansOnly = !orphansOnly; b.classList.toggle("on", orphansOnly); redraw(); };
    box.appendChild(b);
  }
}

function chip(key, color, glyph, label, n) {
  const b = document.createElement("button");
  b.className = "chip";
  b.innerHTML = `<span class="glyph" style="color:${color}">${glyph}</span><span>${esc(label)}</span><span class="n">${n}</span>`;
  b.onclick = () => {
    if (key === "__other__") {
      const val = !isOtherOn();
      for (const [t] of typeOn) if (!typeStyle.has(t)) typeOn.set(t, val);
    } else typeOn.set(key, !typeOn.get(key));
    b.classList.toggle("off");
    redraw();
  };
  return b;
}
const isOtherOn = () => [...typeOn].some(([t, v]) => !typeStyle.has(t) && v);

function visibleIds() {
  let keep = new Set(DATA.nodes.filter(n => typeOn.get(n.type)).map(n => n.id));
  if (orphansOnly) keep = new Set([...keep].filter(id => !(adj.get(id)?.size)));
  if (focusId) {
    const ego = new Set([focusId]);
    let frontier = [focusId];
    for (let d = 0; d < depth; d++) {
      const next = [];
      for (const id of frontier) for (const nb of adj.get(id) ?? [])
        if (!ego.has(nb)) { ego.add(nb); next.push(nb); }
      frontier = next;
    }
    keep = new Set([...ego].filter(id => keep.has(id) || id === focusId));
  }
  return keep;
}

function redraw() {
  const keep = visibleIds();
  const nodes = DATA.nodes.filter(n => keep.has(n.id));
  const links = DATA.links.filter(l => keep.has(l.source.id ?? l.source) && keep.has(l.target.id ?? l.target));
  Graph.graphData({ nodes, links });
  document.getElementById("stats").textContent =
    `${nodes.length}/${DATA.nodes.length} notes · ${links.length}/${DATA.links.length} links` +
    (focusId ? ` · depth ${depth}` : "") + (orphansOnly ? " · orphans only" : "");
}

function select(id) {
  focusId = id;
  const n = DATA.nodes.find(x => x.id === id);
  const ego = document.getElementById("ego");
  ego.classList.add("on");
  ego.querySelector(".name").textContent = n.name;
  redraw();
  openNote(id);
}
function exitEgo() {
  focusId = null;
  document.getElementById("ego").classList.remove("on");
  redraw();
}
document.querySelector("#ego .exit").onclick = exitEgo;
document.querySelector("#ego input").oninput = e => {
  depth = +e.target.value;
  document.querySelector("#ego .d").textContent = depth;
  redraw();
};

let searchTimer;
document.getElementById("search").oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  const box = document.getElementById("results");
  box.innerHTML = "";
  clearTimeout(searchTimer);
  if (q.length < 2) return;
  const hit = (html, id) => {
    const b = document.createElement("button");
    b.innerHTML = html;
    b.onclick = () => { select(id); box.innerHTML = ""; };
    box.appendChild(b);
    return b;
  };
  const shown = new Set();
  for (const n of DATA.nodes.filter(n => n.name.toLowerCase().includes(q)).slice(0, 8)) {
    hit(`${esc(n.name)} <span class="t">· ${esc(n.type)}</span>`, n.id);
    shown.add(n.id);
  }
  // full-text pass, debounced; results append under the name matches
  searchTimer = setTimeout(async () => {
    const r = await fetch(`search?q=${encodeURIComponent(q)}`).catch(() => null);
    if (!r?.ok || document.getElementById("search").value.trim().toLowerCase() !== q) return;
    const { hits } = await r.json();
    for (const h of hits) {
      if (shown.has(h.path) || !byId.has(h.path)) continue;
      const n = byId.get(h.path);
      hit(`${esc(n.name)} <span class="t">· ${esc(n.type)}:${h.line}</span><span class="snip">${esc(h.snippet)}</span>`, h.path);
      shown.add(h.path);
      if (shown.size >= 18) break;
    }
  }, 250);
};

/* ---------- reader ---------- */
const reader = {
  title: document.querySelector("#reader .title"),
  obs: document.querySelector("#reader .obs"),
  path: document.querySelector("#reader .path"),
  article: document.querySelector("#reader article"),
};

async function openNote(id) {
  const r = await fetch(`note?path=${encodeURIComponent(id)}`);
  if (!r.ok) { reader.article.innerHTML = `<p class="empty">Could not load note.</p>`; return; }
  const { content } = await r.json();
  const n = DATA.nodes.find(x => x.id === id);
  reader.title.textContent = n?.name ?? id;
  reader.path.textContent = id;
  reader.obs.hidden = false;
  reader.obs.href = `obsidian://open?vault=${encodeURIComponent(DATA.vault)}&file=${encodeURIComponent(id.replace(/\.md$/, ""))}`;
  const back = [...(inbound.get(id) ?? [])]
    .map(b => byId.get(b)).filter(Boolean)
    .sort((a, b) => a.name.localeCompare(b.name));
  const backHtml = back.length
    ? `<div class="backlinks"><h4>Linked from (${back.length})</h4><ul>` +
      back.map(b => `<li><a class="wiki" data-id="${esc(b.id)}">${esc(b.name)}</a> <span class="t">· ${esc(b.type)}</span></li>`).join("") +
      `</ul></div>`
    : "";
  reader.article.innerHTML = renderMd(content) + backHtml;
  reader.article.scrollTop = 0;
  for (const a of reader.article.querySelectorAll("a.wiki")) {
    a.onclick = ev => { ev.preventDefault(); select(a.dataset.id); };
  }
}

// Minimal markdown renderer — everything escaped first, no external libs.
function renderMd(src) {
  let fm = "";
  const fmM = src.match(/^---\n([\s\S]*?)\n---\n/);
  if (fmM) { fm = fmM[1]; src = src.slice(fmM[0].length); }

  const codeBlocks = [];
  src = src.replace(/```([\s\S]*?)```/g, (_, body) =>
    `\x00B${codeBlocks.push(`<pre><code>${esc(body.replace(/^\w*\n/, ""))}</code></pre>`) - 1}\x00`);

  const lines = src.split("\n");
  const out = [];
  let inUl = false, inOl = false, inBq = false, para = [], bqPara = [];
  const flushBq = () => {
    if (bqPara.length) { out.push(`<p>${inline(bqPara.join(" "))}</p>`); bqPara = []; }
  };
  const closeLists = () => {
    if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; }
    if (inUl) { out.push("</ul>"); inUl = false; }
    if (inOl) { out.push("</ol>"); inOl = false; }
    if (inBq) { flushBq(); out.push("</blockquote>"); inBq = false; }
  };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if (/^\x00B\d+\x00\s*$/.test(line.trim())) { closeLists(); out.push(line.trim()); continue; }
    // GFM table: |-delimited row followed by a |---| separator row
    if (/^\s*\|.*\|\s*$/.test(line) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] ?? "")) {
      closeLists();
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      out.push("<table><thead><tr>" + cells(line).map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>");
      i++;
      while (/^\s*\|.*\|\s*$/.test(lines[i + 1] ?? "")) {
        i++;
        out.push("<tr>" + cells(lines[i]).map(c => `<td>${c}</td>`).join("") + "</tr>");
      }
      out.push("</tbody></table>");
      continue;
    }
    if ((m = line.match(/^(#{1,4})\s+(.*)/))) {
      closeLists();
      out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);
    } else if (/^\s*([-*_]){3,}\s*$/.test(line)) {
      closeLists(); out.push("<hr>");
    } else if ((m = line.match(/^\s*[-*+]\s+(.*)/))) {
      if (!inUl) { closeLists(); out.push("<ul>"); inUl = true; }
      out.push(`<li>${inline(m[1])}</li>`);
    } else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) {
      if (!inOl) { closeLists(); out.push("<ol>"); inOl = true; }
      out.push(`<li>${inline(m[1])}</li>`);
    } else if ((m = line.match(/^>\s?(.*)/))) {
      if (!inBq) { closeLists(); out.push("<blockquote>"); inBq = true; }
      if (m[1].trim() === "") flushBq(); else bqPara.push(m[1].trim());
    } else if (line.trim() === "") {
      closeLists();
    } else if (inUl || inOl) {
      // hard-wrapped continuation of the previous list item
      out[out.length - 1] = out[out.length - 1].replace(/<\/li>$/, ` ${inline(line.trim())}</li>`);
    } else {
      if (inBq) closeLists();
      para.push(line.trim());
    }
  }
  closeLists();
  let html = out.join("\n");
  html = html.replace(/\x00B(\d+)\x00/g, (_, i) => codeBlocks[i]);
  return (fm ? `<div class="fm">${esc(fm)}</div>` : "") + html;
}

function inline(s) {
  s = esc(s);
  // wikilinks first: [[target|display]] / [[target]]
  s = s.replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g, (_, t, disp) => {
    const id = byStem.get(t.trim());
    const label = disp ?? t.trim();
    return id
      ? `<a class="wiki" data-id="${esc(id)}">${label}</a>`
      : `<a class="dead" title="unresolved">${label}</a>`;
  });
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  // md links: internal .md navigates, external opens a tab
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, txt, href) => {
    if (/^https?:\/\//.test(href)) return `<a href="${href}" target="_blank" rel="noopener">${txt}</a>`;
    if (href.endsWith(".md")) {
      const stem = decodeURIComponent(href).split("/").pop().replace(/\.md$/, "").replace(/\s+[0-9a-f]{32}$/, "");
      const id = byStem.get(decodeURIComponent(href).split("/").pop().replace(/\.md$/, "")) ?? byStem.get(stem);
      if (id) return `<a class="wiki" data-id="${esc(id)}">${txt}</a>`;
    }
    return `<a class="dead">${txt}</a>`;
  });
  s = s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  s = s.replace(/(^|[^*\w])\*([^*]+)\*(?!\w)/g, "$1<i>$2</i>");
  return s;
}
